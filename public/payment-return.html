<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All set · RallyHUB</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1E3A5F;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;text-align:center;padding:24px;}
  .card{max-width:380px}
  .check{width:64px;height:64px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;}
  h1{font-size:22px;margin:0 0 8px}
  p{color:rgba(255,255,255,0.75);line-height:1.5;margin:0 0 22px}
  a{display:inline-block;background:#3B82B0;color:#fff;text-decoration:none;font-weight:700;padding:13px 26px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
  <div class="check" id="icon">&#10003;</div>
  <h1 id="title">You're all set</h1>
  <p id="msg">Close this page to go back to RallyHUB.</p>
  <a href="rally://" id="back">Return to RallyHUB</a>
</div>
<script>
  // Stripe sends people here from Checkout / Connect onboarding (iPhone app flow).
  var q = new URLSearchParams(location.search);
  if (q.get('pm_setup') === 'cancelled') {
    document.getElementById('icon').textContent = '✕';
    document.getElementById('icon').style.background = '#8FA8BF';
    document.getElementById('title').textContent = 'No changes made';
  } else if (q.get('for') === 'coach') {
    document.getElementById('msg').textContent = 'Your Stripe details were sent. Close this page to go back to RallyHUB — it may take a minute to verify.';
  }
</script>
</body>
</html>
