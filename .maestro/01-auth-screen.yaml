# A-02, A-05: auth screen basics (no account needed).
appId: com.rallyhub.app
tags: [public]
---
- launchApp: { clearState: true }
- extendedWaitUntil: { visible: "Sign In", timeout: 20000 }
- assertNotVisible: "Supabase not configured"
- assertVisible: "Continue with Google"
- tapOn: "••••••••"
- inputText: "secret123"
- tapOn: "Show password"
- assertVisible: "Hide password"
- tapOn: "Hide password"
- tapOn: "Have an invite code?"
- tapOn: "e.g. a1b2c3d4e5f6"
- inputText: "AB12 cd"
- assertVisible: "ab12cd"
