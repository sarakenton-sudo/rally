# AT-02: athlete view, no parent onboarding, no coach app.
appId: com.rallyhub.app
tags: [athlete]
env: { EMAIL: "${QA_ATHLETE_EMAIL}", PASSWORD: "${QA_ATHLETE_PASSWORD}" }
