# Subflow: sign in with EMAIL / PASSWORD from the calling flow.
appId: com.rallyhub.app
---
- launchApp:
    clearState: true
    clearKeychain: true     # the saved login lives in the keychain and survives clearState
    permissions: { notifications: allow }
- extendedWaitUntil: { visible: ".*Sign In.*", timeout: 20000 }
- tapOn: '.*you@example\.com.*'
- inputText: ${EMAIL}
- tapOn: ".*••••••••.*"
- inputText: ${PASSWORD}
- pressKey: Enter          # Return closes the keyboard (Maestro hideKeyboard fails on RN inputs)
- tapOn: ".*Sign In.*"
- tapOn: { text: ".*Not Now.*", optional: true }   # iOS "Save password?" sheet
