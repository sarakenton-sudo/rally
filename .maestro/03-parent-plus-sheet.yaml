# P-02, P-09, P-11, P-20: + sheet options and the screens they open aren't blank.
appId: com.rallyhub.app
tags: [parent]
env: { EMAIL: "${QA_PARENT_EMAIL}", PASSWORD: "${QA_PARENT_PASSWORD}" }
---
- runFlow: _signin.yaml
- extendedWaitUntil: { visible: ".*Coming up.*", timeout: 30000 }
- tapOn: { id: "plus-button" }
- assertVisible: ".*Paste anything.*"
- assertVisible: ".*View inbox.*"
- scrollUntilVisible: { element: ".*Add travel.*" }
- scrollUntilVisible: { element: ".*Book a lesson.*" }
- scrollUntilVisible: { element: ".*Save a login or code.*" }
- scrollUntilVisible: { element: ".*Invite a coach.*" }
- scrollUntilVisible: { element: ".*Add an athlete.*" }
- assertVisible: ".*Add a team event.*"
- tapOn: ".*Add a tournament or season.*"
- assertVisible: ".*Paste a season schedule.*"
- scrollUntilVisible: { element: ".*Save a login or code.*", direction: UP }
- tapOn: ".*Save a login or code.*"
- assertVisible: '.*Whose is it\?.*'
- tapOn: ".*Close.*"
- tapOn: { id: "plus-button" }
- scrollUntilVisible: { element: ".*Add travel.*" }
- tapOn: ".*Add travel.*"
- tapOn: "Hotel"
- assertVisible: ".*Cancellation Deadline.*"    # Add Hotel is not a blank screen
